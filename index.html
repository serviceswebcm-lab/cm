      document.getElementById('fidX').hidden = false; tell({ cm: 'llave-mostrado', id: m.id }); return;
    }
    if (m.cm === 'llave-cancelar') { if (fmode === 'llave-firmar' && lreq && lreq.id === m.id) { lreq = null; hide(); } return; }
    if (m.cm === 'faceid-estado?') estado();
    else if (m.cm === 'faceid-pedir') { if (fget()) { fmode = 'desbloquear'; sheet('Desbloquear CM', 'Mirá tu iPhone para entrar.', 'Usar Face ID', 'Usar el PIN'); } }
    else if (m.cm === 'faceid-activar' && /^[0-9]{4,6}$/.test(m.pin || '')) { fpin = m.pin; fmode = 'activar'; sheet('Activar Face ID', 'Vas a poder entrar a CM mirando el teléfono. El PIN sigue funcionando siempre.', 'Activar Face ID', 'Ahora no'); }
    else if (m.cm === 'faceid-desactivar' || m.cm === 'faceid-invalido') { fset(null); hide(); estado(); }
    else if (m.cm === 'faceid-cancelar') { if (fmode === 'desbloquear') hide(); }
  });
  // V264: CM corre dentro del marco de Google, donde el iPhone informa 0 en los márgenes de pantalla (isla, esquinas curvas
  // y barra de inicio). Esta página sí los conoce: se los pasa a CM cuando los pide y cada vez que cambian.

  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin) || !ours(e.source)) return;
    if ((e.data || {}).cm !== 'pantalla?') return;

  });
  window.addEventListener('resize', function () { setTimeout(psend, 60); });
  window.addEventListener('orientationchange', function () { setTimeout(psend, 400); });
  start(parse(location.hash));
})();
