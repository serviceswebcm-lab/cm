<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!--
  Crypto Monitor · página propia (V236)
  Esta página NO tiene ningún dato tuyo: ni la dirección de tu Google, ni claves, ni montos.
  Todo lo privado viaja después del "#" de la dirección, que los navegadores nunca le mandan a GitHub,
  y queda guardado solo en tu teléfono. La página únicamente muestra CM (que corre en tu Google) a pantalla completa,
  sin el cartel de Google y como una app.
  Sin archivo de manifiesto a propósito: así el ícono de inicio del iPhone guarda la dirección completa (con el "#")
  y cada vez que lo abrís recuerda tu teléfono.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CM">
<meta name="theme-color" content="#060b15">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://script.google.com; img-src 'self'; style-src 'unsafe-inline'; script-src 'sha256-3S6wgwZkMLr65ftuPAAn1uOuxVVBwXisG2aGTv2bwHs='; base-uri 'none'; form-action 'none'">
<link rel="apple-touch-icon" href="icono-180.png">
<title>CM</title>
<style>
html,body{margin:0;height:100%;background:#060b15;color:#cfe3f5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#cm{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#060b15}
#msg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;line-height:1.45}
#msg b{font-size:22px;color:#e8f1ff}#msg span{color:#8ea3c0;font-size:15px;max-width:380px}
#msg input{width:100%;max-width:380px;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid #23405e;background:#0e1c2e;color:#e8f1ff;font:15px inherit;font-family:inherit}
#msg button{padding:12px 22px;border-radius:12px;border:0;background:#3fd0ff;color:#04121f;font:700 15px inherit;font-family:inherit}
#msg em{color:#ff8f9f;font-style:normal;font-size:14px;min-height:18px}
</style>
</head>
<body>
<iframe id="cm" title="Crypto Monitor" referrerpolicy="no-referrer" allow="clipboard-write"></iframe>
<div id="msg"><b>Crypto Monitor</b><span>Escaneá el código de vinculación de CM en tu PC (Portfolio → Configuración → Nube) o pegá acá el enlace. Cada código sirve una sola vez.</span><input id="lnk" type="url" placeholder="Pegá el enlace de vinculación" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="go" type="button">Vincular</button><em id="err"></em></div>
<script>
(function () {
  var KEY = 'cm_dispositivo_v1';                     // queda solo en este teléfono (no viaja a ningún lado)
  var ID = /^[A-Za-z0-9_-]{20,120}$/, DEV = /^[A-Za-z0-9_-]{8,20}\.[A-Za-z0-9_-]{43}$/, PAIR = /^[A-Za-z0-9_-]{43}$/, CODE = /^[A-Za-z0-9_-]{20,43}$/;
  function parse(h) { var o = {}; String(h || '').replace(/^[^#]*#?/, '').split('&').forEach(function (p) { var i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = p.slice(i + 1); }); return o; }
  function get() { try { return parse('#' + (localStorage.getItem(KEY) || '').replace(/^#/, '')); } catch (_) { return {}; } }
  function put(u, d) { var h = '#u=' + u + '&d=' + d; try { localStorage.setItem(KEY, h); } catch (_) {} history.replaceState(null, '', location.pathname + h); }
  function start(p) {
    var saved = get(), msg = document.getElementById('msg'), f = document.getElementById('cm');
    var u = ID.test(p.u || '') ? p.u : (ID.test(saved.u || '') ? saved.u : '');
    var inner = '';
    if (u && CODE.test(p.p || '')) { inner = 'p=' + p.p; history.replaceState(null, '', location.pathname + '#u=' + u); }      // código de un solo uso
    else if (u && PAIR.test(p.cm || '')) { inner = 'cm=' + p.cm; history.replaceState(null, '', location.pathname + '#u=' + u); }
    else if (u && DEV.test(p.d || '')) { inner = 'd=' + p.d; put(u, p.d); }
    else if (u && DEV.test(saved.d || '') && saved.u === u) { inner = 'd=' + saved.d; put(u, saved.d); }
    if (!u) { msg.style.display = 'flex'; f.style.display = 'none'; return; }
    // Sin datos de este dispositivo: CM (en tu Google) pide el código de 8 números que muestra la PC.
    if (!inner) { try { localStorage.setItem(KEY, '#u=' + u); } catch (_) {} }
    msg.style.display = 'none'; f.style.display = 'block';
    f.src = 'https://script.google.com/macros/s/' + u + '/exec#' + (inner ? inner + '&' : '') + 'o=' + encodeURIComponent(location.origin);
    window.CMU = u;
  }
  // CM (dentro de tu Google) avisa la dirección de este teléfono al terminar de vincular.
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin) || !window.CMU) return;
    var m = e.data || {};
    if (m.cm === 'dispositivo' && /^d=/.test(m.hash || '')) { var d = String(m.hash).slice(2).split('&')[0]; if (DEV.test(d)) put(window.CMU, d); }
  });
  document.getElementById('go').addEventListener('click', function () {
    var p = parse(document.getElementById('lnk').value.trim());
    if (!ID.test(p.u || '') || !(CODE.test(p.p || '') || PAIR.test(p.cm || ''))) { document.getElementById('err').textContent = 'Ese no es un enlace de vinculación de CM.'; return; }
    start(p);
  });
  start(parse(location.hash));
})();
</script>
</body>
</html>
